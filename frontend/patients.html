<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients — Dr. Getaneh Dental Clinic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🦷 Dr. Getaneh Dental Clinic</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="patients.html" class="active">Patients</a>
      <span id="navUser"></span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h2>Patient Management</h2>

    <!-- Register Patient -->
    <div class="card">
      <h3>Register New Patient</h3>
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="regFirst" placeholder="Abebe">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="regLast" placeholder="Kebede">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="regPhone" placeholder="09XXXXXXXX or +251XXXXXXXXX">
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" id="regAge" placeholder="25" min="1" max="119">
        </div>
      </div>
      <div id="regError" class="error-msg" style="display:none;"></div>
      <div id="regSuccess" class="success-msg" style="display:none;"></div>
      <button class="btn-primary" id="regBtn">Register Patient</button>
    </div>

    <!-- Patient List -->
    <div class="card">
      <div class="card-header-row">
        <h3>All Patients</h3>
        <input type="text" id="patientSearch" placeholder="Search by name or phone..." style="width:250px;">
      </div>
      <div id="patientList">Loading...</div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Edit Patient</h3>
      <input type="hidden" id="editId">
      <div class="form-group"><label>First Name</label><input type="text" id="editFirst"></div>
      <div class="form-group"><label>Last Name</label><input type="text" id="editLast"></div>
      <div class="form-group"><label>Phone</label><input type="text" id="editPhone"></div>
      <div class="form-group"><label>Age</label><input type="number" id="editAge"></div>
      <div id="editError" class="error-msg" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn-primary" id="saveEditBtn">Save Changes</button>
        <button class="btn-secondary" onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    fetch('/api/auth/me', { credentials: 'include' })
      .then(r => r.json())
      .then(d => {
        if (!d.success) window.location.href = 'index.html';
        else document.getElementById('navUser').textContent = d.user.username + ' (' + d.user.role + ')';
      });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = 'index.html';
    });

    // Register patient
    document.getElementById('regBtn').addEventListener('click', async () => {
      const errDiv = document.getElementById('regError');
      const okDiv = document.getElementById('regSuccess');
      errDiv.style.display = 'none'; okDiv.style.display = 'none';

      const body = {
        first_name: document.getElementById('regFirst').value.trim(),
        last_name: document.getElementById('regLast').value.trim(),
        phone_number: document.getElementById('regPhone').value.trim(),
        age: document.getElementById('regAge').value
      };

      const res = await fetch('/api/patients', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data.success) {
        okDiv.textContent = '✅ Patient registered successfully!';
        okDiv.style.display = 'block';
        document.getElementById('regFirst').value = '';
        document.getElementById('regLast').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regAge').value = '';
        loadPatients();
      } else {
        errDiv.textContent = data.message;
        errDiv.style.display = 'block';
      }
    });

    // Search patients
    let searchTimeout;
    document.getElementById('patientSearch').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => loadPatients(e.target.value), 300);
    });

    loadPatients();

    async function loadPatients(search = '') {
      const url = search ? `/api/patients?search=${encodeURIComponent(search)}` : '/api/patients';
      const res = await fetch(url, { credentials: 'include' });
      const data = await res.json();
      const div = document.getElementById('patientList');
      if (!data.patients || data.patients.length === 0) {
        div.innerHTML = '<p class="empty-msg">No patients found.</p>';
        return;
      }
      div.innerHTML = `
        <table class="data-table">
          <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Age</th><th>Registered</th><th>Actions</th></tr></thead>
          <tbody>
            ${data.patients.map(p => `
              <tr>
                <td>${p.patient_id}</td>
                <td>${p.first_name} ${p.last_name}</td>
                <td>${p.phone_number}</td>
                <td>${p.age}</td>
                <td>${new Date(p.created_at).toLocaleDateString()}</td>
                <td><button class="btn-sm btn-info" onclick="openEdit(${p.patient_id},'${p.first_name}','${p.last_name}','${p.phone_number}',${p.age})">Edit</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function openEdit(id, first, last, phone, age) {
      document.getElementById('editId').value = id;
      document.getElementById('editFirst').value = first;
      document.getElementById('editLast').value = last;
      document.getElementById('editPhone').value = phone;
      document.getElementById('editAge').value = age;
      document.getElementById('editError').style.display = 'none';
      document.getElementById('editModal').style.display = 'flex';
    }

    document.getElementById('saveEditBtn').addEventListener('click', async () => {
      const id = document.getElementById('editId').value;
      const errDiv = document.getElementById('editError');
      errDiv.style.display = 'none';
      const res = await fetch(`/api/patients/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          first_name: document.getElementById('editFirst').value,
          last_name: document.getElementById('editLast').value,
          phone_number: document.getElementById('editPhone').value,
          age: document.getElementById('editAge').value
        })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('editModal').style.display = 'none';
        loadPatients();
      } else {
        errDiv.textContent = data.message;
        errDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
